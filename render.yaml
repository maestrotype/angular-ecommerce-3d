services:
  - type: web
    name: angular-ecommerce-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: angular-ecommerce-3d
    env: static
    staticPublishPath: dist/angular-ecommerce-3d
