services:
  - type: web
    name: angular-ecommerce-backend
    runtime: docker
    rootDir: .
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

  # Node runtime alternative (if not using Docker):
  # rootDir: .  (repository root — required for npm workspaces)
  # buildCommand: npm run render:build
  # startCommand: npm run render:start
  #
  # Legacy backend-only rootDir (backend/) — use backend/package.json build:render
  # buildCommand: npm run build:render
  # startCommand: npm run start:prod

  - type: web
    name: angular-ecommerce-3d
    env: static
    staticPublishPath: dist/angular-ecommerce-3d
