services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-ecommerce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Override if host 5432 is taken: POSTGRES_HOST_PORT=5434 docker compose up
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API — build context is repo root (npm workspaces). See backend/Dockerfile.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-ecommerce_db}
      # Compose Postgres has no TLS — must override production auto-SSL
      DATABASE_SSL: "false"
      # Local Compose has no migration runner — auto-create schema for the demo stack
      TYPEORM_SYNCHRONIZE: "true"
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-4200}
    ports:
      - "${BACKEND_HOST_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  # Angular CSR via nginx; /api and /uploads proxied to backend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:

networks:
  default:
    name: ecommerce-network
