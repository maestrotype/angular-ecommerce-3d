
<div class="message-list-container">
    <div class="header">
      <h2>Messages</h2>
    </div>
  
    <div class="filters">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search messages</mat-label>
        <input matInput [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Search by name, email, or subject">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="status-filter">
        <mat-label>Status</mat-label>
        <mat-select [(value)]="statusFilter" (selectionChange)="onStatusFilterChange()">
          <mat-option value="all">All</mat-option>
          <mat-option value="new">New</mat-option>
          <mat-option value="read">Read</mat-option>
          <mat-option value="archived">Archived</mat-option>
        </mat-select>
      </mat-form-field>
  
      <button mat-raised-button color="primary" (click)="onSearch()">
        <mat-icon>search</mat-icon>
        Search
      </button>
    </div>
  
    <div class="table-container">
      <table mat-table [dataSource]="filteredMessages" class="messages-table">
        <ng-container matColumnDef="senderName">
          <th mat-header-cell *matHeaderCellDef>Sender Name</th>
          <td mat-cell *matCellDef="let message">{{ message.senderName }}</td>
        </ng-container>
  
        <ng-container matColumnDef="senderEmail">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let message">{{ message.senderEmail }}</td>
        </ng-container>
  
        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef>Subject</th>
          <td mat-cell *matCellDef="let message">{{ message.subject }}</td>
        </ng-container>
  
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let message">
            <mat-chip [color]="getStatusColor(message.status)" selected>
              {{ message.status | titlecase }}
            </mat-chip>
          </td>
        </ng-container>
  
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let message">{{ message.createdAt | date:'short' }}</td>
        </ng-container>
  
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let message">
            <button mat-icon-button color="primary" (click)="viewMessage(message)" matTooltip="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="markAsRead(message)" 
                    *ngIf="message.status === 'new'" matTooltip="Mark as Read">
              <mat-icon>mark_email_read</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="markAsArchived(message)" 
                    *ngIf="message.status !== 'archived'" matTooltip="Archive">
              <mat-icon>archive</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteMessage(message)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <div *ngIf="loading" class="loading">
        <mat-spinner></mat-spinner>
      </div>
  
      <div *ngIf="!loading && filteredMessages.length === 0" class="no-data">
        <p>No messages found.</p>
      </div>
    </div>
  </div>
