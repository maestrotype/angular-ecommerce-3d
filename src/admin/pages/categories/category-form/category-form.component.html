<div class="category-form-container">
  <div class="header-section">
    <h1>{{ isEditMode ? ('EDIT_CATEGORY' | translate) : ('ADD_CATEGORY' | translate) }}</h1>
    <button mat-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
      {{ 'BACK_TO_CATEGORIES' | translate }}
    </button>
  </div>

  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="category-form">
    <mat-card class="form-card">
      <mat-card-header>
        <mat-card-title>{{ 'CATEGORY_INFO' | translate }}</mat-card-title>
      </mat-card-header>
      <mat-card-content class="form-content">
        <div class="localization-group">
          <label class="group-label">{{ 'CATEGORY_NAME' | translate }}</label>
          <div class="lang-fields">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>EN</mat-label>
              <input matInput formControlName="name_en" placeholder="English name" />
              <mat-error *ngIf="categoryForm.get('name_en')?.hasError('required')">
                {{ 'CATEGORY_NAME_REQUIRED' | translate }}
              </mat-error>
              <mat-error *ngIf="categoryForm.get('name_en')?.hasError('minlength')">
                {{ 'CATEGORY_NAME_MINLENGTH' | translate }}
              </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>RU</mat-label>
              <input matInput formControlName="name_ru" placeholder="Russian name" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>UA</mat-label>
              <input matInput formControlName="name_ua" placeholder="Ukrainian name" />
            </mat-form-field>
          </div>
        </div>

        <div class="localization-group">
          <label class="group-label">{{ 'DESCRIPTION' | translate }}</label>
          <div class="lang-fields">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>EN</mat-label>
              <textarea matInput formControlName="description_en" rows="3" placeholder="English description"></textarea>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>RU</mat-label>
              <textarea matInput formControlName="description_ru" rows="3" placeholder="Russian description"></textarea>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>UA</mat-label>
              <textarea matInput formControlName="description_ua" rows="3"
                placeholder="Ukrainian description"></textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="image-upload-section">
          <label class="group-label">{{ 'CATEGORY_ICON' | translate }}</label>
          <app-image-processor [control]="$any(categoryForm.get('icon'))" [label]="'Upload Category Icon'"
            [processingOptions]="{ removeBackground: true, optimize: true }" (fileProcessed)="onImageProcessed($event)"
            (processingError)="onImageError($event)">
          </app-image-processor>
        </div>
      </mat-card-content>
    </mat-card>
    <div class="form-actions">
      <button mat-button type="button" (click)="goBack()" class="cancel-button">
        Cancel
      </button>
      <button mat-raised-button color="primary" type="submit" [disabled]="categoryForm.invalid || isLoading"
        class="submit-button">
        <mat-icon *ngIf="isLoading" class="spinning">refresh</mat-icon>
        {{ isLoading
        ? (isEditMode ? ('SAVING' | translate) : ('CREATING' | translate))
        : (isEditMode ? ('UPDATE_CATEGORY' | translate) : ('CREATE_CATEGORY' | translate))
        }}
      </button>
    </div>
  </form>
</div>
