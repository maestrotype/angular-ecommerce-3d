<div class="list">
  <div class="list__header">
    <div class="list__header-left">
      <ng-content select="[list-header]"></ng-content>
      <h1 class="list__title" *ngIf="!title && !false"></h1>
      <h1 class="list__title" *ngIf="title">{{ title }}</h1>
    </div>
    <div class="list__kpis">
      <ng-content select="[list-kpis]"></ng-content>
    </div>
  </div>

  <div class="list__filters"><ng-content select="[list-filters]"></ng-content></div>

  <div class="list__content"><ng-content></ng-content></div>
</div>
