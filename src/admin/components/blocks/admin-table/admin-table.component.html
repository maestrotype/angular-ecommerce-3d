<div [class]="containerClasses">
  <div class="admin-table-wrapper" *ngIf="!loading">
    <ng-content></ng-content>
    <mat-paginator
      *ngIf="showPaginator"
      [pageSizeOptions]="pageSizeOptions"
      [showFirstLastButtons]="showFirstLastButtons"
    ></mat-paginator>
  </div>

  <div *ngIf="loading" class="admin-table-loading">
    <app-skeleton-loader variant="list-row" [count]="skeletonRows"></app-skeleton-loader>
  </div>
</div>
