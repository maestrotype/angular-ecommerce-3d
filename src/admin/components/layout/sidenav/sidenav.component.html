<div class="admin-sidenav">
  <div class="sidenav-header-mobile" *ngIf="isMobile">
    <span class="menu-title">{{ 'MENU' | translate }}</span>
    <button class="close-btn" (click)="closeSidenav.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-nav-list class="sidenav-nav">
    <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
      (click)="onNavItemClick()">
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label | translate }}</span>
    </a>
  </mat-nav-list>

  <div class="sidenav-extra-sections" *ngIf="isMobile">
    <div class="mobile-section">
      <span class="section-label">{{ 'THEME' | translate }}</span>
      <div class="theme-chips">
        <button *ngFor="let theme of themes" class="chip-btn" [class.active]="currentTheme === theme.id"
          (click)="changeTheme(theme.id)">
          {{ theme.name }}
        </button>
      </div>
    </div>

    <div class="mobile-section">
      <span class="section-label">{{ 'LANGUAGE' | translate }}</span>
      <div class="theme-chips">
        <button *ngFor="let lang of languages" class="chip-btn" [class.active]="currentLang === lang.code"
          (click)="changeLanguage(lang.code)">
          {{ lang.label }}
        </button>
      </div>
    </div>

    <div class="mobile-section">
      <span class="section-label">{{ 'GO_TO_STOREFRONT' | translate }}</span>
      <div class="theme-chips">
        <a mat-button class="chip-btn storefront-btn" [routerLink]="'/home'">
          <mat-icon>storefront</mat-icon>
          {{ 'GO_TO_STOREFRONT' | translate }}
        </a>
      </div>
    </div>
  </div>

  <div class="sidenav-footer">
    <button mat-button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      {{ 'LOGOUT' | translate }}
    </button>
  </div>
</div>
