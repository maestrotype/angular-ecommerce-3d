<mat-toolbar class="admin-header">
  <button mat-icon-button class="menu-button" (click)="toggleSidenav.emit()" aria-label="Toggle sidenav">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="header-title">{{ "ADMIN_PANEL" | translate }}</span>

  <span class="spacer"></span>

  <div class="header-actions">
    <button mat-icon-button class="storefront-link" [routerLink]="'/home'"
      [attr.aria-label]="'GO_TO_STOREFRONT' | translate"
      [matTooltip]="'GO_TO_STOREFRONT' | translate">
      <mat-icon>storefront</mat-icon>
    </button>

    <!-- Theme Toggle -->
    <button mat-icon-button class="theme-toggle" (click)="toggleTheme()" [matTooltip]="
        currentTheme === 'light' ? 'Switch to Dark Theme' : 
        currentTheme === 'dark' ? 'Switch to Glass Theme' : 
        currentTheme === 'glass' ? 'Switch to Dark Glass Theme' :
        'Switch to Light Theme'
      " *ngIf="!isMobile">
      <mat-icon>
        {{ currentTheme === 'light' ? 'dark_mode' :
           currentTheme === 'dark' ? 'blur_on' :
           currentTheme === 'glass' ? 'nights_stay' :
           'light_mode' }}
      </mat-icon>
    </button>

    <!-- Notifications -->
    <button mat-icon-button [matMenuTriggerFor]="notificationMenu" #notificationMenuTrigger="matMenuTrigger"
      class="notification-button">
    </button>

    <app-notification-badge [count]="unreadCount" [pulse]="unreadCount > 0"
      (onClick)="openNotificationMenu()"></app-notification-badge>

    <!-- User Menu -->
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Notification Menu -->
<mat-menu #notificationMenu="matMenu" class="notification-menu" yPosition="below" xPosition="after">
  <div class="notification-header">
    <span class="notification-title">{{ "NOTIFICATIONS" | translate }}</span>
    <button mat-button class="mark-all-read" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
      <span>{{ "MARK_ALL_READ" | translate }}</span>
    </button>
  </div>

  <div class="notification-list" *ngIf="notifications.length > 0; else noNotifications">
    <button mat-menu-item class="notification-item" [class.unread]="notification.status === 'unread'"
      (click)="onNotificationClick(notification)" *ngFor="let notification of notifications">
      <div class="notification-content">
        <div class="notification-icon">
          <mat-icon>
            {{ getNotificationIcon(notification.type) }}
          </mat-icon>
        </div>
        <div class="notification-text">
          <div class="notification-title">{{ notification.title | translate:notification.data }}</div>
          <div class="notification-message">{{ notification.message | translate:notification.data }}</div>
          <div class="notification-time">
            {{ getRelativeTime(notification.createdAt) }}
          </div>
        </div>
        <div class="notification-status" *ngIf="notification.status === 'unread'">
          <div class="unread-dot"></div>
        </div>
      </div>
    </button>
  </div>

  <ng-template #noNotifications>
    <div class="no-notifications">
      <mat-icon>notifications_none</mat-icon>
      <span>{{ "NO_NOTIFICATIONS" | translate }}</span>
    </div>
  </ng-template>
</mat-menu>

<!-- User Menu -->
<mat-menu #userMenu="matMenu">
  <button mat-menu-item routerLink="/admin/profile">
    <mat-icon>person</mat-icon>
    <span>{{ "PROFILE" | translate }}</span>
  </button>
  <button mat-menu-item routerLink="/admin/settings">
    <mat-icon>settings</mat-icon>
    <span>{{ "SETTINGS" | translate }}</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>{{ "LOGOUT" | translate }}</span>
  </button>
</mat-menu>
