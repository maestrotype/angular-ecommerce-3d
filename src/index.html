  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        var isAdmin = /^\/admin(\/|$)/.test(path);
        var storageKey = isAdmin ? 'selected-theme-admin' : 'selected-theme';
        var saved = localStorage.getItem(storageKey);
        if (isAdmin && !saved) {
          saved = localStorage.getItem('adminTheme');
        }
        saved = saved || 'light';
        if (saved === 'default') saved = 'light';
        if (!isAdmin && saved === 'dark-glass') saved = 'dark';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) { /* private mode / blocked storage */ }
    })();
  </script>

  <!-- GitHub Pages SPA redirect script -->
  <script>
    // Single Page Apps for GitHub Pages redirect script
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <!-- Restore redirect from 404.html -->
  <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
  </script>

<body class="mat-typography">
  <script>
    (function () {
      try {
        if (/^\/admin(\/|$)/.test(window.location.pathname || '')) {
          document.body.classList.add('is-admin');
          var t = document.documentElement.getAttribute('data-theme');
          if (t) document.body.setAttribute('data-theme', t);
        }
      } catch (e) { /* ignore */ }
    })();
