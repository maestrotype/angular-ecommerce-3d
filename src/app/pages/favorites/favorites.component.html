<section class="favorites-page">
  <div class="fav-shell">
    <header class="fav-top">
      <button type="button" class="fav-back" (click)="goBack()">
        <app-icon name="arrow-left" [width]="16" [height]="16"></app-icon>
        <span>{{ 'FAVORITES.BACK_TO_SHOP' | translate }}</span>
      </button>

      <div class="fav-top__row">
        <div class="fav-heading">
          <div class="fav-title-line">
            <h1 class="fav-title">{{ 'FAVORITES.TITLE' | translate }}</h1>
            <span class="fav-count" *ngIf="!isLoading && favorites.length > 0" aria-hidden="true">
              {{ favorites.length }}
            </span>
          </div>
          <p class="fav-subtitle">{{ 'FAVORITES.SUBTITLE' | translate }}</p>
        </div>

        <button
          type="button"
          class="fav-clear"
          *ngIf="!isLoading && favorites.length > 0"
          (click)="onClearFavorites()"
          [disabled]="favorites.length === 0">
          {{ 'FAVORITES.CLEAR_ALL' | translate }}
        </button>
      </div>
    </header>

    <div class="fav-body">
      <app-loading-spinner
        *ngIf="isLoading"
        [message]="'FAVORITES.LOADING' | translate">
      </app-loading-spinner>

      <app-empty-state
        *ngIf="!isLoading && favorites.length === 0"
        icon="favorite_border"
        [title]="'FAVORITES.EMPTY_TITLE' | translate"
        [description]="'FAVORITES.EMPTY_MSG' | translate"
        [actionLabel]="'FAVORITES.EXPLORE_BTN' | translate"
        (actionClick)="onShopNow()">
      </app-empty-state>

      <div *ngIf="!isLoading && favorites.length > 0" class="fav-grid">
        <article
          *ngFor="let product of favorites; let i = index"
          class="fav-card"
          [style.animation-delay.ms]="i * 45"
          (click)="onProductClick(product)">
          <div class="fav-card__media">
            <img
              [src]="product.imageUrl"
              [alt]="product.name | localized"
              loading="lazy" />

            <button
              type="button"
              class="fav-card__heart"
              [attr.aria-label]="'FAVORITES.REMOVE_ITEM' | translate"
              (click)="onRemoveFavorite(product); $event.stopPropagation()">
              <app-icon name="heart" [width]="18" [height]="18" fill="currentColor" stroke="currentColor"></app-icon>
            </button>

            <button
              type="button"
              class="fav-card__cart"
              [attr.aria-label]="'FAVORITES.ADD_TO_CART' | translate"
              (click)="onAddToCart(product); $event.stopPropagation()">
              <app-icon name="shopping-cart" [width]="18" [height]="18"></app-icon>
            </button>
          </div>

          <div class="fav-card__info">
            <span class="fav-card__category">{{ product.category }}</span>
            <h2 class="fav-card__name">{{ product.name | localized }}</h2>
            <div class="fav-card__price">
              <span class="fav-card__price-now">${{ getDiscountedPrice(product) | number:'1.2-2' }}</span>
              <span class="fav-card__price-was" *ngIf="product.discount">
                ${{ product.price | number:'1.2-2' }}
              </span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
