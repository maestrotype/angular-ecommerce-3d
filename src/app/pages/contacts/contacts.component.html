<section id="contacts" class="contact-section">
  <div class="container">
    <div class="contact-content">
      <div class="contact-info">
        <h2>{{ (data?.title | localized) || ('CONTACTS.TITLE' | translate) }}</h2>
        <p>{{ (data?.subtitle | localized) || ('CONTACTS.SUBTITLE' | translate) }}</p>
        <div class="contact-details">
          <div class="contact-item">
            <span class="icon icon-mail"></span>
            <span>info&#64;3dstore.com</span>
          </div>
          <div class="contact-item">
            <span class="icon icon-phone"></span>
            <span>+1 (555) 123-4567</span>
          </div>
          <div class="contact-item">
            <span class="icon icon-location"></span>
            <span>123 Fashion Street, NY 10001</span>
          </div>
        </div>
      </div>
      <div class="contact-form">
        <app-contact-form (messageSent)="onMessageSent()"></app-contact-form>
      </div>
    </div>
  </div>
</section>
