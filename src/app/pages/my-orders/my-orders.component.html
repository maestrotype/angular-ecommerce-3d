<section class="orders-page">
  <div class="container">
    <div class="header">
      <button class="back" (click)="goShop()">{{ 'ORDERS.BACK_BTN' | translate }}</button>
      <h1>{{ 'ORDERS.TITLE' | translate }}</h1>
    </div>

    <div class="state" *ngIf="isLoading">{{ 'ORDERS.STATUS_LOADING' | translate }}</div>
    <div class="state error" *ngIf="!isLoading && error">{{ error }}</div>

    <div class="empty" *ngIf="!isLoading && !error && orders.length === 0">
      <app-empty-state
        icon="receipt_long"
        [title]="'ORDERS.EMPTY_MSG' | translate"
        [actionLabel]="'ORDERS.EMPTY_BTN' | translate"
        (actionClick)="goShop()"
      ></app-empty-state>
    </div>

    <div class="orders" *ngIf="!isLoading && !error && orders.length > 0">
      <div class="order" *ngFor="let order of orders">
        <div class="row">
          <div class="left">
            <div class="id">#{{ order.id }}</div>
            <div class="date">{{ order.createdAt | date:'medium' }}</div>
          </div>
          <div class="right">
            <span class="badge">{{ getStatusLabel(order.status) }}</span>
            <span class="count">{{ getItemsCount(order) }} {{ 'ORDERS.COUNT_SUFFIX' | translate }}</span>
            <span class="total">${{ getTotal(order) | number:'1.2-2' }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
