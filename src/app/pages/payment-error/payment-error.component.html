<div class="payment-error-container" [class]="getThemeClass('payment-error-container')">
  <div class="error-content">
    <div class="error-icon">
      <mat-icon>error</mat-icon>
    </div>
    
    <h1 class="error-title">Payment Failed</h1>
    <p class="error-message">{{ errorMessage }}</p>
    
    <div class="payment-details" [class]="getThemeClass('payment-details')" *ngIf="orderId || amount">
      <div class="detail-row" *ngIf="orderId">
        <span class="detail-label">Order ID:</span>
        <span class="detail-value">#{{ orderId }}</span>
      </div>
      
      <div class="detail-row" *ngIf="amount">
        <span class="detail-label">Amount:</span>
        <span class="detail-value">${{ amount.toFixed(2) }}</span>
      </div>
    </div>
    
    <div class="error-actions">
      <button 
        mat-raised-button 
        color="primary" 
        class="action-btn primary-btn"
        (click)="tryAgain()"
      >
        Try Again
      </button>
      
      <button 
        mat-stroked-button 
        class="action-btn secondary-btn"
        (click)="goToCart()"
      >
        Go to Cart
      </button>
      
      <button 
        mat-stroked-button 
        class="action-btn secondary-btn"
        (click)="contactSupport()"
      >
        Contact Support
      </button>
      
      <button 
        mat-stroked-button 
        class="action-btn secondary-btn"
        (click)="goToHome()"
      >
        Go to Home
      </button>
    </div>
    
    <div class="error-info">
      <p>If the problem persists, please contact our support team.</p>
      <p>Your order has not been charged.</p>
    </div>
  </div>
</div>
