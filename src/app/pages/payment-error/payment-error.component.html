<div class="payment-result payment-result--error">
  <div class="payment-result__panel">
    <div class="payment-result__icon">
      <mat-icon>error</mat-icon>
    </div>

    <h1 class="payment-result__title">{{ 'PAYMENT.STATUS.FAILED_TITLE' | translate }}</h1>
    <p class="payment-result__message">{{ errorMessage }}</p>

    <div class="payment-result__details" *ngIf="orderId || amount">
      <div class="payment-result__detail-row" *ngIf="orderId">
        <span class="payment-result__detail-label">{{ 'PAYMENT.INFO.ORDER_ID' | translate }}:</span>
        <span class="payment-result__detail-value">#{{ orderId }}</span>
      </div>

      <div class="payment-result__detail-row" *ngIf="amount">
        <span class="payment-result__detail-label">{{ 'MODALS.CART.TOTAL' | translate }}:</span>
        <span class="payment-result__detail-value">${{ amount.toFixed(2) }}</span>
      </div>
    </div>

    <div class="payment-result__actions">
      <button type="button" class="payment-result__btn payment-result__btn--danger" (click)="tryAgain()">
        {{ 'PAYMENT.STATUS.RETRY' | translate }}
      </button>

      <button type="button" class="payment-result__btn payment-result__btn--secondary" (click)="goToCart()">
        {{ 'PAYMENT.ERROR_PAGE.GO_TO_CART' | translate }}
      </button>

      <button type="button" class="payment-result__btn payment-result__btn--secondary" (click)="contactSupport()">
        {{ 'PAYMENT.ERROR_PAGE.CONTACT_SUPPORT' | translate }}
      </button>

      <button type="button" class="payment-result__btn payment-result__btn--secondary" (click)="goToHome()">
        {{ 'PAYMENT.SUCCESS_PAGE.GO_HOME' | translate }}
      </button>
    </div>

    <div class="payment-result__info">
      <p>{{ 'PAYMENT.ERROR_PAGE.INFO' | translate }}</p>
      <p>{{ 'PAYMENT.ERROR_PAGE.NOT_CHARGED' | translate }}</p>
    </div>
  </div>
</div>
