<div class="payment-success-container" [class]="getThemeClass('payment-success-container')">
  <div class="success-content">
    <div class="success-icon">
      <mat-icon>check_circle</mat-icon>
    </div>
    
    <h1 class="success-title">Payment Successful!</h1>
    <p class="success-message">Your payment has been processed successfully.</p>
    
    <div class="payment-details" [class]="getThemeClass('payment-details')">
      <div class="detail-row">
        <span class="detail-label">Order ID:</span>
        <span class="detail-value">#{{ orderId || 'N/A' }}</span>
      </div>
      
      <div class="detail-row" *ngIf="amount">
        <span class="detail-label">Amount:</span>
        <span class="detail-value">${{ amount.toFixed(2) }}</span>
      </div>
      
      <div class="detail-row" *ngIf="paymentMethod">
        <span class="detail-label">Payment Method:</span>
        <span class="detail-value">{{ paymentMethod | titlecase }}</span>
      </div>
    </div>
    
    <div class="success-actions">
      <button 
        mat-raised-button 
        color="primary" 
        class="action-btn primary-btn"
        (click)="continueShopping()"
      >
        Continue Shopping
      </button>
      
      <button 
        mat-stroked-button 
        class="action-btn secondary-btn"
        (click)="viewOrderDetails()"
        *ngIf="orderId"
      >
        View Order Details
      </button>
      
      <button 
        mat-stroked-button 
        class="action-btn secondary-btn"
        (click)="goToHome()"
      >
        Go to Home
      </button>
    </div>
    
    <div class="success-info">
      <p>You will receive a confirmation email shortly.</p>
      <p>Thank you for your purchase!</p>
    </div>
  </div>
</div>
