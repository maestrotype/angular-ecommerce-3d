<div class="viewer-page" (mousemove)="onMouseMove($event)" (mouseup)="onMouseUp()">
  
  <!-- TOP BAR -->
  <header class="viewer-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>{{ 'VIEWER.BACK' | translate }}</span>
    </button>

    <div class="viewer-title">
      <span>{{ productName }}</span>
    </div>

    <!-- Mode tabs (only if both exist) -->
    <div class="mode-tabs" *ngIf="images.length > 0 && model3dUrl">
      <button class="tab-btn" [class.active]="mode === 'image'" (click)="setMode('image')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        {{ 'VIEWER.PHOTO' | translate }}
      </button>
      <button class="tab-btn" [class.active]="mode === '3d'" (click)="setMode('3d')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        {{ 'VIEWER.MODEL_3D' | translate }}
      </button>
    </div>
  </header>

  <!-- IMAGE VIEWER -->
  <div class="viewer-canvas" *ngIf="mode === 'image'">
    <button class="nav-arrow arrow-left" (click)="prevImage()" *ngIf="images.length > 1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="image-container" (wheel)="onWheel($event)" (dblclick)="toggleZoom()">
      <img
        [src]="images[currentIndex]"
        [alt]="productName"
        [ngStyle]="imageStyle"
        (mousedown)="onMouseDown($event)"
        draggable="false"
        class="main-image"
      />
    </div>

    <button class="nav-arrow arrow-right" (click)="nextImage()" *ngIf="images.length > 1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 6 15 12 9 18"></polyline>
      </svg>
    </button>

    <!-- Image counter -->
    <div class="image-counter" *ngIf="images.length > 1">
      {{ currentIndex + 1 }} / {{ images.length }}
    </div>

    <!-- Zoom controls -->
    <div class="zoom-controls">
      <button (click)="zoomIn()" title="Zoom in">+</button>
      <span>{{ (scale * 100).toFixed(0) }}%</span>
      <button (click)="zoomOut()" title="Zoom out">−</button>
      <button (click)="resetZoom()" *ngIf="scale > 1" class="reset-btn">↺</button>
    </div>

    <!-- Hint -->
    <div class="image-hint">
      <span>{{ 'VIEWER.HINT' | translate }}</span>
    </div>
  </div>

  <!-- 3D VIEWER -->
  <div class="viewer-canvas viewer-3d" *ngIf="mode === '3d'">
    <app-three-d-viewer
      *ngIf="model3dUrl"
      [modelPath]="model3dUrl"
      [hdModelPath]="localModel3dUrl"
      [scale]="[9, 9, 9]"
      [position]="[0, 0, 0]"
      [previewOnly]="false"
      (modelLoaded)="modelReady = true"
    ></app-three-d-viewer>
  </div>

  <!-- THUMBNAILS -->
  <div class="thumbnails-bar" *ngIf="images.length > 1">
    <div class="thumbnails-scroll">
      <div 
        class="thumb" 
        *ngFor="let img of images; let i = index"
        [class.active]="i === currentIndex && mode === 'image'"
        (click)="selectImage(i)"
      >
        <img [src]="img" [alt]="'Image ' + (i + 1)">
      </div>
      <div 
        class="thumb thumb-3d" 
        *ngIf="model3dUrl"
        [class.active]="mode === '3d'"
        (click)="setMode('3d')"
      >
        <div class="thumb-3d-container">
          <app-three-d-viewer
            [modelPath]="model3dUrl"
            [hdModelPath]="localModel3dUrl"
            [scale]="[9, 9, 9]"
            [position]="[0, 0, 0]"
            [previewOnly]="true"
            [autoRotate]="true"
          ></app-three-d-viewer>
          <div class="thumb-3d-badge">3D</div>
        </div>
      </div>
    </div>
  </div>

</div>
