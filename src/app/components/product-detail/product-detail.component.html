<div class="product-detail" *ngIf="!loading && product">
  <!-- Header -->
  <div class="product-header">
    <div class="container">
      <button class="back-btn glass-theme" (click)="goBack()">
        ← Back to Shop
      </button>
      <nav class="breadcrumb">
        <a class="breadcrumb-link" (click)="navigateToHome()">Home</a> /
        <a class="breadcrumb-link" (click)="navigateToShop()">Shop</a> /
        <a class="breadcrumb-link" (click)="navigateToCategory()">{{
          product.category
        }}</a>
        /
        <span class="current">{{ product.name }}</span>
      </nav>
    </div>
  </div>

  <!-- Product Content -->
  <div class="product-content">
    <div class="container">
      <div class="product-grid">
        <div class="product-detail-main">
          <div class="main-view">
            <div
              *ngIf="product?.stock !== undefined && product.stock <= 0"
              class="out-of-stock-badge"
            >
              OUT OF STOCK
            </div>
            <img
              *ngIf="selectedType === 'image' && product?.images?.length"
              [src]="product.images[selectedImageIndex]"
              (click)="onImageClicked()"
              alt="Product image"
              class="main-image"
            />
            <app-three-d-viewer
              *ngIf="selectedType === '3d' && product?.model3dUrl"
              [modelPath]="product.model3dUrl"
              class="main-3d-viewer"
              [previewOnly]="false"
              [scale]="[9, 9, 9]"
              [position]="[0, 0, 0]"
            ></app-three-d-viewer>
          </div>

          <div class="thumbnails">
            <img
              *ngFor="let img of product?.images; let i = index"
              [src]="img"
              [class.selected]="
                selectedType === 'image' && selectedImageIndex === i
              "
              (click)="onThumbnailSelected('image', i)"
              alt="Product thumbnail"
              class="thumb-image"
            />
            <app-three-d-viewer
              *ngIf="product?.model3dUrl"
              [modelPath]="product.model3dUrl"
              class="thumb-3d"
              [class.selected]="selectedType === '3d'"
              (click)="onThumbnailSelected('3d')"
              [previewOnly]="true"
              [scale]="[9, 9, 9]"
              [position]="[0, 0, 0]"
            ></app-three-d-viewer>
          </div>
        </div>
        <div class="product-detail-info">
          <!-- Product Info Component -->
          <app-product-info
            [product]="product"
            [quantity]="quantity"
            (quantityChanged)="onQuantityChanged($event)"
            (addToCart)="onAddToCart()"
          >
          </app-product-info>
          <!-- Product Tabs Component -->
          <app-product-tabs [product]="product"></app-product-tabs>
        </div>
      </div>

      <!-- Similar Products Section -->
      <div class="similar-products-section">
        <app-similar-products
          [product]="product"
          [limit]="4"
          [showTitle]="true"
          title="Similar Products"
        >
        </app-similar-products>
      </div>

      <!-- Bought Together Section -->
      <div class="bought-together-section">
        <app-bought-together
          [product]="product"
          [limit]="4"
          [showTitle]="true"
          title="Frequently Bought Together"
        >
        </app-bought-together>
      </div>
    </div>
  </div>
</div>

<!-- Loading State -->
<div class="loading" *ngIf="loading">
  <div class="container">
    <div class="loading-content">
      <p>Loading product details...</p>
    </div>
  </div>
</div>

<!-- Product Not Found -->
<div class="not-found" *ngIf="!loading && !product">
  <div class="container">
    <div class="not-found-content">
      <h2>Product Not Found</h2>
      <p>The product you're looking for doesn't exist.</p>
      <button class="back-btn glass-theme" (click)="goBack()">
        Back to Shop
      </button>
    </div>
  </div>
</div>
