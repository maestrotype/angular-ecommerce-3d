<div class="product-detail" *ngIf="!loading && product">
  <!-- Header -->
  <div class="product-header">
    <div class="container">
      <button type="button" class="back-btn" (click)="goBack()">
        <app-icon name="arrow-left" [width]="16" [height]="16"></app-icon>
        <span class="btn-text">{{ 'PRODUCT.BACK_BTN' | translate }}</span>
      </button>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a class="breadcrumb-link" (click)="navigateToHome()">{{ 'PRODUCT.BREADCRUMBS.HOME' | translate }}</a>
        <span class="breadcrumb-separator">/</span>
        <a class="breadcrumb-link" (click)="navigateToShop()">{{ 'PRODUCT.BREADCRUMBS.SHOP' | translate }}</a>
        <span class="breadcrumb-separator">/</span>
        <a class="breadcrumb-link" (click)="navigateToCategory()">{{ product.category }}</a>
        <span class="breadcrumb-separator">/</span>
        <span class="current breadcrumb-current">{{ product.name | localized }}</span>
      </nav>
    </div>
  </div>

  <!-- Product Content -->
  <div class="product-content">
    <div class="container">
      <div class="product-grid">
        <div class="product-detail-main">
          <div class="main-view">
            <div *ngIf="product?.stock !== undefined && product.stock <= 0" class="out-of-stock-badge">
              {{ 'PRODUCT.STOCK.OUT_OF_STOCK' | translate }}
            </div>
            <img *ngIf="selectedType === 'image' && product?.images?.length" [src]="product.images[selectedImageIndex]"
              alt="Product image" class="main-image" (click)="onImageClicked()" />
            <app-three-d-viewer *ngIf="selectedType === '3d' && product?.model3dUrl" [modelPath]="product.model3dUrl" [hdModelPath]="product['localModel3dUrl']"
              class="main-3d-viewer" [previewOnly]="false" [scale]="[9, 9, 9]"
              [position]="[0, 0, 0]" (click)="$event.stopPropagation()"></app-three-d-viewer>
            <div class="expand-overlay">
              <div class="expand-icon" (click)="onImageClicked()" role="button" tabindex="0"
                (keydown.enter)="onImageClicked()" (keydown.space)="onImageClicked(); $event.preventDefault()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <polyline points="9 21 3 21 3 15"></polyline>
                  <line x1="21" y1="3" x2="14" y2="10"></line>
                  <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
                <span>{{ (selectedType === '3d' ? 'VIEWER.EXPAND_3D' : 'VIEWER.EXPAND_PHOTO') | translate }}</span>
              </div>
            </div>
          </div>

          <div class="thumbnails">
            <img *ngFor="let img of product?.images; let i = index" [src]="img" [class.selected]="
                selectedType === 'image' && selectedImageIndex === i
              " (click)="onThumbnailSelected('image', i)" alt="Product thumbnail" class="thumb-image" />
            <div *ngIf="product?.model3dUrl" class="thumb-3d-wrap"
              [class.selected]="selectedType === '3d'"
              (click)="onThumbnailSelected('3d')">
              <app-three-d-viewer [modelPath]="product.model3dUrl" [hdModelPath]="product['localModel3dUrl']" class="thumb-3d"
                [previewOnly]="true" [scale]="[9, 9, 9]" [position]="[0, 0, 0]" [autoRotate]="true"></app-three-d-viewer>
              <span class="thumb-3d-badge">3D</span>
            </div>
          </div>
        </div>
        <div class="product-detail-info">
          <app-product-info [product]="product" [quantity]="quantity" (quantityChanged)="onQuantityChanged($event)"
            (addToCart)="onAddToCart()">
          </app-product-info>
          <ng-container *ngFor="let section of sections">
            <app-section-renderer 
              *ngIf="section.type === 'product-tabs'"
              [section]="section"
              [contextData]="product">
            </app-section-renderer>
          </ng-container>
        </div>
      </div>

      <ng-container *ngFor="let section of sections">
        <div class="modular-section-wrapper" *ngIf="section.type !== 'product-tabs'">
          <app-section-renderer 
            [section]="section"
            [contextData]="product">
          </app-section-renderer>
        </div>
      </ng-container>
    </div>
  </div>
</div>

<!-- Loading State -->
<div class="product-detail-page-state" *ngIf="loading">
  <div class="container">
    <app-loading-spinner size="lg" [message]="'PRODUCT.LOADING' | translate"></app-loading-spinner>
  </div>
</div>

<!-- Product Not Found -->
<div class="product-detail-page-state" *ngIf="!loading && !product">
  <div class="container">
    <app-empty-state
      [title]="'PRODUCT.NOT_FOUND.TITLE' | translate"
      [description]="'PRODUCT.NOT_FOUND.MSG' | translate"
      [actionLabel]="'PRODUCT.BACK_BTN' | translate"
      (actionClick)="goBack()">
    </app-empty-state>
  </div>
</div>
