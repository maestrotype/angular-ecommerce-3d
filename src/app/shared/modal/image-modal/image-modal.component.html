<div class="image-modal">
  <!-- Header -->
  <div class="image-modal-header">
    <h2 class="product-name">{{ imageData.productName }}</h2>
    <!-- Note: We are deliberately skipping the custom close button here
           since the BaseModalComponent already provides one perfectly positioned -->
  </div>

  <!-- Main Image Container -->
  <div class="main-image-container" (wheel)="onWheel($event)" (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)" (mouseup)="onMouseUp()" (mouseleave)="onMouseUp()"
    (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)" (touchend)="onTouchEnd()"
    (dblclick)="toggleZoom()">

    <img [src]="imageData.images[imageData.currentIndex]" [alt]="imageData.productName" class="main-image"
      [style.transform]="transformStyle" [class.is-zoomed]="scale > 1" [class.is-dragging]="isDragging"
      draggable="false" />

    <!-- Zoom Controls -->
    <div class="zoom-controls">
      <button class="zoom-btn" (click)="zoomOut()" [disabled]="scale <= 1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <span class="zoom-level">{{ Math.round(scale * 100) }}%</span>
      <button class="zoom-btn" (click)="zoomIn()" [disabled]="scale >= 4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <!-- Navigation Arrows -->
    <div class="navigation-arrows" *ngIf="imageData.images.length > 1">
      <button class="nav-arrow nav-arrow-left" (click)="previousImage()"
        [attr.aria-label]="'MODALS.IMAGE.PREVIOUS' | translate">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>

      <button class="nav-arrow nav-arrow-right" (click)="nextImage()"
        [attr.aria-label]="'MODALS.IMAGE.NEXT' | translate">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Thumbnails -->
  <div class="thumbnails-container" *ngIf="imageData.images.length > 1">
    <div class="thumbnails">
      <button *ngFor="let image of imageData.images; let i = index" class="thumbnail"
        [class.active]="i === imageData.currentIndex" (click)="selectImage(i)">
        <img [src]="image"
          [alt]="imageData.productName + ' ' + ('MODALS.IMAGE.THUMBNAIL' | translate) + ' ' + (i + 1)" />
      </button>
    </div>
    <div class="image-counter">
      {{ 'MODALS.IMAGE.COUNTER' | translate:{current: imageData.currentIndex + 1, total: imageData.images.length} }}
    </div>
  </div>
</div>
