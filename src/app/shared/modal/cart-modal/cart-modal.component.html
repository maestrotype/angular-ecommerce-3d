<div class="cart-modal">
  <div class="cart-header">
    <h2>{{ 'MODALS.CART.TITLE' | translate }}</h2>
  </div>

  <div class="cart-content">
    <app-empty-state
      *ngIf="cartItems.length === 0"
      icon="shopping_cart"
      size="compact"
      [description]="'MODALS.CART.EMPTY_MESSAGE' | translate"
      [actionLabel]="'MODALS.CART.CONTINUE_SHOPPING' | translate"
      (actionClick)="onClose()"
    ></app-empty-state>

    <div *ngIf="cartItems.length > 0" class="cart-items">
      <div *ngFor="let item of cartItems" class="cart-item">
        <div class="item-image">
          <img [src]="item.imageUrl" [alt]="item.name | localized" />
        </div>

        <div class="item-details">
          <h3 class="item-name">{{ item.name | localized }}</h3>
          <p class="item-price theme-price">${{ item.price | number:'1.2-2' }}</p>

          <div class="quantity-controls">
            <button type="button" class="quantity-btn" (click)="updateQuantity(item.productId, -1)">-</button>
            <span>{{ item.quantity }}</span>
            <button type="button" class="quantity-btn" (click)="updateQuantity(item.productId, 1)">+</button>
          </div>
        </div>

        <button type="button" class="remove-btn" (click)="removeItem(item.productId)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-footer">
    <div class="total-section">
      <div class="total-price">
        <strong class="theme-price">
          {{ 'MODALS.CART.TOTAL_DISPLAY' | translate:{price: totalPrice | number:'1.2-2'} }}
        </strong>
      </div>

      <div class="checkout-actions">
        <button type="button" class="continue-btn" (click)="onClose()">
          {{ 'MODALS.CART.CONTINUE_SHOPPING' | translate }}
        </button>
        <button type="button" class="checkout-btn" (click)="checkout()">
          {{ 'MODALS.CART.PLACE_ORDER' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
