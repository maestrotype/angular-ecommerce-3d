<button 
  [class]="buttonClasses"
  (click)="onFavoriteClick($event)"
  [disabled]="isLoading"
  [attr.aria-label]="isFavorite ? 'Remove from favorites' : 'Add to favorites'"
  type="button"
>
  <div class="favorite-button__icon">
    <svg 
      width="24" 
      height="24" 
      viewBox="0 0 24 24" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
      class="favorite-button__heart"
    >
      <path 
        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
        [class.favorite-button__heart--filled]="isFavorite"
      />
    </svg>
  </div>
  
  <span 
    *ngIf="showText" 
    class="favorite-button__text"
  >
    {{ isFavorite ? 'Remove' : 'Add to Favorites' }}
  </span>
  
  <!-- Loading spinner -->
  <div 
    *ngIf="isLoading" 
    class="favorite-button__loader"
  >
    <div class="favorite-button__spinner"></div>
  </div>
</button>
