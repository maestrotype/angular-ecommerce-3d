<form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="senderName">Your Name</label>
    <input
      type="text"
      id="senderName"
      formControlName="senderName"
      [class.invalid]="isFieldInvalid('senderName')"
      placeholder="Your Name"
    />
    <div class="error-message" *ngIf="isFieldInvalid('senderName')">
      {{ getErrorMessage('senderName') }}
    </div>
  </div>

  <div class="form-group">
    <label for="senderEmail">Your Email</label>
    <input
      type="email"
      id="senderEmail"
      formControlName="senderEmail"
      [class.invalid]="isFieldInvalid('senderEmail')"
      placeholder="Your Email"
    />
    <div class="error-message" *ngIf="isFieldInvalid('senderEmail')">
      {{ getErrorMessage('senderEmail') }}
    </div>
  </div>

  <div class="form-group">
    <label for="subject">Subject</label>
    <input
      type="text"
      id="subject"
      formControlName="subject"
      [class.invalid]="isFieldInvalid('subject')"
      placeholder="Subject"
    />
    <div class="error-message" *ngIf="isFieldInvalid('subject')">
      {{ getErrorMessage('subject') }}
    </div>
  </div>

  <div class="form-group">
    <label for="message">Your Message</label>
    <textarea
      id="message"
      formControlName="message"
      [class.invalid]="isFieldInvalid('message')"
      placeholder="Your Message"
      rows="5"
    ></textarea>
    <div class="error-message" *ngIf="isFieldInvalid('message')">
      {{ getErrorMessage('message') }}
    </div>
  </div>

  <button 
    type="submit" 
    class="cta-button-glass"
    [disabled]="isSubmitting || contactForm.invalid"
  >
    <span *ngIf="!isSubmitting">SEND MESSAGE</span>
    <span *ngIf="isSubmitting">SENDING...</span>
  </button>
</form>
