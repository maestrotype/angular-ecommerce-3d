<button 
  [class]="buttonClasses"
  [disabled]="disabled || loading"
  type="button">
  
  <span *ngIf="icon && !text" class="btn-icon-content">
    <mat-icon>{{ icon }}</mat-icon>
  </span>
  
  <span *ngIf="text">
    <mat-icon *ngIf="icon" class="mr-sm">{{ icon }}</mat-icon>
    {{ text }}
  </span>
</button>
