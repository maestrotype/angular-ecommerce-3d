<div class="logo-wrapper" [style.width.px]="width" [style.height.px]="height">
    <svg [attr.width]="width" [attr.height]="height" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg"
        class="logo-image">
        <defs>
            <linearGradient id="logoGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
            </linearGradient>
        </defs>
        <g transform="translate(10,15)">
            <polygon points="0,15 15,0 30,15 15,30" fill="url(#logoGradient1)" opacity="0.9" />
            <polygon points="15,0 30,15 30,30 15,15" fill="url(#logoGradient1)" opacity="0.7" />
            <polygon points="0,15 15,0 15,15 0,30" fill="url(#logoGradient1)" opacity="0.5" />
        </g>
        <ng-container *ngIf="showText">
            <text x="55" y="25" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="currentColor">3D</text>
            <text x="55" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="currentColor"
                letter-spacing="1px">Store</text>
        </ng-container>
        <circle cx="140" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
        <circle cx="150" cy="30" r="2" fill="#6B7280" opacity="0.4" />
    </svg>
</div>
