<section id="best-sellers" class="best-sellers">
    <div class="section-wrapper">
        <div class="section-header">
            <span class="section-subtitle">{{ data?.subtitle || "TOP PRODUCTS" }}</span>
            <h2 class="section-title">{{ data?.title || "Best Sellers" }}</h2>
        </div>

        <!-- Debug information -->
        <div *ngIf="bestSellersProducts.length === 0" style="text-align: center; padding: 2rem; color: #666;">
            <p>Loading products... ({{ bestSellersProducts.length }} products loaded)</p>
        </div>

        <div class="products-grid" *ngIf="bestSellersProducts.length > 0">
            <div 
                class="product-card animate-in" 
                *ngFor="let product of bestSellersProducts; trackBy: trackByProductId"
                (click)="goToProductDetail(product.id)"
                [class.out-of-stock]="product?.stock !== undefined && product.stock <= 0">
                <div class="product-image">
                    <img [src]="product.imageUrl" [alt]="product.name" loading="lazy" />
                    
                    <div class="product-overlay">
                        <div class="overlay-actions">
                            <button class="action-btn" (click)="goToProductDetail(product.id); $event.stopPropagation()">
                                <span class="material-icons">visibility</span>
                            </button>
                            <button class="action-btn favorite-btn" 
                                    [class.is-favorite]="isFavorite(product.id)"
                                    (click)="toggleFavorite(product); $event.stopPropagation()">
                                <span class="material-icons">favorite_border</span>
                                <span class="material-icons filled">favorite</span>
                            </button>
                            <button class="action-btn" (click)="addToCart(product); $event.stopPropagation()">
                                <span class="material-icons">shopping_cart</span>
                            </button>
                        </div>
                    </div>

                    <div class="special-badge" *ngIf="product.isSpecial">Special</div>
                    <div class="new-badge" *ngIf="product.isNew">New</div>
                    <div class="discount-badge" *ngIf="product.discount">-{{product.discount}}%</div>
                    <div class="out-of-stock-badge" *ngIf="product?.stock !== undefined && product.stock <= 0">
                        Out of Stock
                    </div>
                </div>

                <div class="product-info">
                    <h3 class="product-name">{{ product.name }}</h3>
                    
                    <div class="product-footer">
                        <div class="product-price">
                            <div class="price-main">
                                <span class="current-price">${{ product.price }}</span>
                                <span class="original-price" *ngIf="product.originalPrice">${{ product.originalPrice }}</span>
                            </div>
                        </div>
                        <div class="product-category">{{ product.category }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
