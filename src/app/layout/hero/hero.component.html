<section class="hero" id="hero">
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <div class="badge">{{ 'HOME.HERO.BADGE' | translate }}</div>
        <h1 class="hero-title">
          {{ data?.title || ('HOME.HERO.TITLE_DEFAULT' | translate) }}<br />
          <span class="highlight">{{ data?.subtitle || ('HOME.HERO.SUBTITLE_DEFAULT' | translate) }}</span>
        </h1>
        <p class="hero-subtitle">
          {{
          data?.content || ('HOME.HERO.CONTENT_DEFAULT' | translate)
          }}
        </p>
      </div>

      <div class="hero-image">
        <div class="product-showcase">
          <div class="floating-product" [class.hidden]="modelReady">
            <img *ngIf="data?.showImage && data?.imageUrl" [src]="data?.imageUrl"
              [alt]="'HOME.HERO.ALT_TEXT' | translate" class="featured-product" loading="lazy" />
            <!-- Decorative elements -->
            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>
            <div class="decoration decoration-3"></div>
          </div>
          <div class="wrap-model">
            <app-three-d-viewer *ngIf="data?.show3d && data?.model3dUrl" [modelPath]="data?.model3dUrl"
              [scale]="[9, 9, 9]" [position]="[0, 0, 0]"></app-three-d-viewer>
          </div>
        </div>
      </div>
      <div class="wrap-btn">
        <button class="cta-button" (click)="onShopNow()">{{ 'HOME.HERO.SHOP_NOW' | translate }}</button>
      </div>
    </div>
  </div>

  <!-- Background decorative elements -->
  <div class="bg-decoration bg-decoration-1"></div>
  <div class="bg-decoration bg-decoration-2"></div>
</section>
