<section class="hero" id="hero">
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <div class="badge">{{ 'HOME.HERO.BADGE' | translate }}</div>
        <h1 class="hero-title">
          {{ (data?.title | localized) || "DISCOVER YOUR" }}<br />
          <span class="highlight">{{ (data?.subtitle | localized) || "NEW STYLE" }}</span>
        </h1>
        <p class="hero-subtitle">
          {{ (data?.content | localized) || "Explore our latest interactive 3D collection." }}
        </p>
      </div>

      <div class="hero-image">
        <div class="product-showcase">
          <div class="floating-product" [class.hidden]="modelReady">
            <img *ngIf="data?.showImage && data?.imageUrl" [src]="data?.imageUrl" alt="Featured Handbag"
              class="featured-product" loading="lazy" />
            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>
            <div class="decoration decoration-3"></div>
          </div>
          <div class="wrap-model" *ngIf="data?.show3d && data?.model3dUrl">
            <app-three-d-viewer [modelPath]="data?.model3dUrl"
              [scale]="[9, 9, 9]" [position]="[0, 0, 0]" [previewOnly]="true"></app-three-d-viewer>
          </div>
        </div>
      </div>

      <div class="wrap-btn">
        <button class="cta-button" (click)="onShopNow()">{{ 'HOME.HERO.SHOP_NOW' | translate }}</button>
      </div>
    </div>
  </div>

  <div class="bg-decoration bg-decoration-1"></div>
  <div class="bg-decoration bg-decoration-2"></div>
</section>
