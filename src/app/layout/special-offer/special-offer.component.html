<section class="special-offer">
    <div class="container">
        <div class="offer-content">
            <div class="offer-image">
                <div class="sale-badge">
                    {{ 'HOME.SPECIAL_OFFER.BADGE' | translate }}<br>
                    <span class="discount">30%</span>
                </div>
                <img [src]="data?.imageUrl" [alt]="'HOME.SPECIAL_OFFER.TITLE_DEFAULT' | translate" class="product-image"
                    loading="lazy">
            </div>

            <div class="offer-text">
                <h2 class="offer-title">{{ data?.title || ('HOME.SPECIAL_OFFER.TITLE_DEFAULT' | translate) }}</h2>
                <p class="offer-subtitle">{{ data?.subtitle || ('HOME.SPECIAL_OFFER.SUBTITLE_DEFAULT' | translate) }}
                </p>
                <button class="shop-button" (click)="onShopNow()">
                    {{ 'HOME.SPECIAL_OFFER.SHOP_NOW' | translate }}
                </button>
            </div>
        </div>
    </div>
</section>
