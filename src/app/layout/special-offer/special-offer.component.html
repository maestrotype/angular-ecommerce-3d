<section class="special-offer">
    <div class="container">
        <div class="offer-content">
            <div class="offer-image">
                <div class="sale-badge">
                    SALE<br>
                    <span class="discount">30%</span>
                </div>
                <img [src]="data?.imageUrl" alt="Special Offer Bag" class="product-image" loading="lazy">
            </div>

            <div class="offer-text">
                <h2 class="offer-title">{{ data?.title | loc }}</h2>
                <p class="offer-subtitle">{{ data?.subtitle | loc }}</p>
                <button class="shop-button" (click)="onShopNow()">
                    SHOP NOW
                </button>
            </div>
        </div>
    </div>
</section>
