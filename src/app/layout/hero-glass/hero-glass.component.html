<section class="hero" id="hero-glass">
  <!-- NEW ARRIVAL background -->
  <div class="new-arrival-bg">{{ 'HOME.HERO.BADGE' | translate }}</div>
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title">
          {{ (data?.title | localized) || "DISCOVER YOUR" }}<br />
          <span class="highlight">{{ (data?.subtitle | localized) || "NEW STYLE" }}</span>
        </h1>
        <p class="hero-subtitle">
          {{ (data?.content | localized) || "Explore our latest interactive 3D collection." }}
        </p>
        <div class="wrap-btn">
          <button class="cta-button-glass" (click)="onShopNow()">{{ 'HOME.HERO.SHOP_NOW' | translate }}</button>
        </div>
      </div>
      <div class="hero-image">
        <div class="product-showcase">
          <div class="floating-product" [class.hidden]="modelReady">
            <img *ngIf="data?.showImage && data?.imageUrl" [src]="data?.imageUrl | imageUrl" alt="Featured Handbag"
              class="featured-product" loading="lazy" />
            <!-- Decorative elements -->
            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>
            <div class="decoration decoration-3"></div>
            <div class="glass-particle particle-1"></div>
            <div class="glass-particle particle-2"></div>
            <div class="glass-particle particle-3"></div>
            <div class="glass-particle particle-4"></div>
          </div>
          <div class="wrap-model" *ngIf="data?.show3d && data?.model3dUrl">
            <app-three-d-viewer [modelPath]="data?.model3dUrl"
              [scale]="modelScale" [position]="modelPosition" [previewOnly]="true" [autoRotate]="true"></app-three-d-viewer>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Background decorative elements -->
  <div class="bg-decoration bg-decoration-1"></div>
  <div class="bg-decoration bg-decoration-2"></div>
  <div class="color-spray bag-spray"></div>
  <div class="color-spray text-spray"></div>
  <div class="glass-orb orb-1"></div>
  <div class="glass-orb orb-2"></div>
  <div class="glass-orb orb-3"></div>
</section>
