<section id="categories" class="categories">
    <div class="container">
        <div class="section-header">
            <span class="section-subtitle">{{ data?.subtitle }}</span>
            <h2 class="section-title">{{ data?.title || "Shop by Category" }}</h2>
        </div>

        <div class="categories-grid">
            <div class="category-card" *ngFor="let category of categories" (click)="navigateToCategory(category)">
                <div class="category-icon">
                    <img [src]="category.icon" [alt]="category.name" loading="lazy">
                </div>
                <h3 class="category-name">{{ category.name }}</h3>
            </div>
        </div>
    </div>
</section>
