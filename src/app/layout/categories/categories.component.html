<section id="categories" class="categories">
    <div class="container">
        <div class="section-header">
            <span class="section-subtitle">{{ (data?.subtitle | localized) || ('HOME.CATEGORIES.BROWSE' | translate) }}</span>
            <h2 class="section-title">{{ (data?.title | localized) || ('HOME.CATEGORIES.TITLE' | translate) }}</h2>
        </div>

        <div class="categories-grid">
            <div class="category-card" *ngFor="let category of categories; trackBy: trackByCategory" (click)="navigateToCategory(category)">
                <div class="category-icon">
                    <img [src]="category.icon | imageUrl" [alt]="category.name | localized" loading="lazy">
                </div>
                <h3 class="category-name">{{ category.name | localized }}</h3>
            </div>
        </div>
    </div>
</section>
