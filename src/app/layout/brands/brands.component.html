<section class="brands" id="brands">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">{{ 'HOME.BRANDS.TITLE' | translate }}</h2>
        </div>

        <div class="brands-grid">
            <div
                class="brand-item"
                *ngFor="let brand of brands"
                [attr.data-brand-name]="brand.name | localized"
                tabindex="0"
                role="img"
                [attr.aria-label]="(brand.name | localized) + ' — ' + ('HOME.BRANDS.VISIT' | translate)"
            >
                <img [src]="brand.logo" [alt]="brand.name | localized" class="brand-logo">
            </div>
        </div>
    </div>
</section>
